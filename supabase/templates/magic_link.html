<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c1f23;">
    <div style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:28px;">
      <h1 style="margin:0 0 8px;font-size:18px;font-weight:600;">Your sign-in code</h1>
      <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#555b63;">
        Enter this code to sign in to Chat Router.
      </p>

      <div style="font-size:30px;font-weight:700;letter-spacing:8px;text-align:center;padding:16px;background:#f3f4f6;border-radius:10px;">
        {{ .Token }}
      </div>

      <p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#6b7280;">
        This code expires shortly. If you didn't request it, you can ignore
        this email &mdash; no one can sign in without it.
      </p>
    </div>
  </body>
</html>
